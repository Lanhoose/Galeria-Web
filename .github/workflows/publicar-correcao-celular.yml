name: Publicar correção da importação offline no celular
on:
  push:
    branches: [roleta-celular-importacao-v2-1-1]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir os arquivos
        run: sha256sum --check arquivos/SHA256SUMS
      - name: Publicar HTML com importação corrigida
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create roleta-celular-importacao-v2.1.1 arquivos/Roleta_Pokemon_Celular_Offline_v2_1_1.html arquivos/LEIA-ME_CELULAR.txt arquivos/VALIDACAO_IMPORTACAO.json arquivos/SHA256SUMS --target "$RELEASE_COMMIT" --title "Roleta Pokémon — importação de progresso corrigida no Android" --notes-file RELEASE_NOTES.md --latest=false
